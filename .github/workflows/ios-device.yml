name: Signed iPhone build
on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload signed build to App Store Connect for TestFlight processing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-device
  cancel-in-progress: false
jobs:
  device:
    runs-on: macos-15
    environment: ios-device
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify signing prerequisites
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          API_KEY: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          API_ID: ${{ secrets.ASC_KEY_ID }}
          API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          UPLOAD: ${{ inputs.upload_testflight }}
        run: |
          test -n "$CERT" && test -n "$PASSWORD" && test -n "$PROFILE" || { echo 'Signing secrets are missing; see docs/IOS_DEVICE.md.'; exit 1; }
          if [[ "$UPLOAD" == true ]]; then
            test -n "$API_KEY" && test -n "$API_ID" && test -n "$API_ISSUER" || { echo 'App Store Connect credentials are missing.'; exit 1; }
          fi
      - name: Load native toolchain contract
        id: toolchain
        run: python3 scripts/mobile_build_config.py --github-output "$GITHUB_OUTPUT" --github-env "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false
      - name: Build pinned framework and project
        run: |
          ./scripts/build_go_ios.sh
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          ./scripts/generate_xcode_project.sh
      - name: Import signing material into temporary keychain
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          umask 077
          SIGN_KEYCHAIN="$RUNNER_TEMP/vfr-signing.keychain-db"
          SIGN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$SIGN_PASSWORD"
          echo "SIGN_KEYCHAIN=$SIGN_KEYCHAIN" >> "$GITHUB_ENV"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$SIGN_PASSWORD" "$SIGN_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGN_KEYCHAIN"
          security unlock-keychain -p "$SIGN_PASSWORD" "$SIGN_KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$PASSWORD" -A -t cert -f pkcs12 -k "$SIGN_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$SIGN_PASSWORD" "$SIGN_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$SIGN_KEYCHAIN" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 scripts/device_signing.py "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist" "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
      - name: Archive and export signed device app
        run: |
          xcodebuild -project ios/VehicleFlightRecorder.xcodeproj -scheme VehicleFlightRecorder \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/ios-device/VehicleFlightRecorder.xcarchive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$SIGN_TEAM" PROVISIONING_PROFILE_SPECIFIER="$SIGN_PROFILE" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}${GITHUB_RUN_ATTEMPT}" archive
          xcodebuild -exportArchive -archivePath build/ios-device/VehicleFlightRecorder.xcarchive \
            -exportPath build/ios-device/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          codesign --verify --deep --strict build/ios-device/VehicleFlightRecorder.xcarchive/Products/Applications/VehicleFlightRecorder.app
          printf 'Commit: %s\nBuild: %s%s\nSigned device artifact; installation and hardware checks pending.\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" > build/ios-device/provenance.txt
      - name: Retain signed artifact (private signing inputs excluded)
        uses: actions/upload-artifact@v4
        with:
          name: VehicleFlightRecorder-signed-iphone
          path: |
            build/ios-device/export/*.ipa
            build/ios-device/provenance.txt
            build/ios/native-build-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload to TestFlight processing
        if: inputs.upload_testflight
        env:
          API_KEY: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          API_ID: ${{ secrets.ASC_KEY_ID }}
          API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_$API_ID.p8"
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" xcrun altool --upload-app --type ios \
            --file build/ios-device/export/VehicleFlightRecorder.ipa --apiKey "$API_ID" --apiIssuer "$API_ISSUER"
      - name: Clean signing material
        if: always()
        run: |
          if [[ -n "${SIGN_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
          if [[ -n "${SIGN_PROFILE:-}" ]]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$SIGN_PROFILE.mobileprovision"; fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$RUNNER_TEMP/private_keys"
