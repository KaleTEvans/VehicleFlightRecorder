name: iOS Simulator Preview

on:
  workflow_dispatch:
    inputs:
      upload_to_appetize:
        description: "Upload mock-only build to Appetize using account access defaults (requires secret)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-preview
  cancel-in-progress: false

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read and verify native toolchain contract
        id: toolchain
        run: python3 scripts/mobile_build_config.py --github-output "$GITHUB_OUTPUT" --github-env "$GITHUB_ENV"

      - name: Report Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          uname -m

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Build pinned device and simulator XCFramework from source
        run: ./scripts/build_go_ios.sh

      - name: Generate existing XcodeGen project
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
          ./scripts/generate_xcode_project.sh

      - name: Compile unsigned device app (no installation or hardware claim)
        run: |
          xcodebuild \
            -project ios/VehicleFlightRecorder.xcodeproj \
            -scheme VehicleFlightRecorder \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device-validation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          mkdir -p build/native-acceptance/device-compile
          cp build/ios-device-validation/Build/Products/Debug-iphoneos/VehicleFlightRecorder.app/Info.plist build/native-acceptance/device-compile/Info.plist

      - name: Build real SwiftUI app for ARM iOS Simulator
        run: |
          xcodebuild \
            -project ios/VehicleFlightRecorder.xcodeproj \
            -scheme VehicleFlightRecorder \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-preview/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Create and boot matching iPhone simulator (bounded)
        id: destination
        timeout-minutes: 10
        run: python3 scripts/boot_ios_simulator.py

      - name: Test real native Go bridge and export
        env:
          SIMULATOR_ID: ${{ steps.destination.outputs.id }}
        run: |
          xcodebuild \
            -project ios/VehicleFlightRecorder.xcodeproj \
            -scheme VehicleFlightRecorder \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/ios-preview/DerivedData \
            -resultBundlePath build/ios-preview/NativeTests.xcresult \
            -parallel-testing-enabled NO \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO test
          APP_DATA=$(xcrun simctl get_app_container "$SIMULATOR_ID" com.kaleevans.vehicleflightrecorder data)
          mkdir -p build/native-acceptance
          xcrun xcresulttool export attachments \
            --path build/ios-preview/NativeTests.xcresult \
            --output-path build/native-acceptance/ui-attachments
          cp -R "$APP_DATA/Documents/NativeAcceptance/Exports" build/native-acceptance/
          cp -R "$APP_DATA/Documents/NativeAcceptance/Connections" build/native-acceptance/
          printf 'Simulator: %s\nCommit: %s\n' "$SIMULATOR_ID" "$GITHUB_SHA" > build/native-acceptance/provenance.txt
          xcrun simctl io "$SIMULATOR_ID" screenshot build/native-acceptance/simulator.png

      - name: Validate native-generated session exports in Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct native exports
        run: |
          ./scripts/bootstrap.sh
          analytics/.venv/bin/python scripts/validate_native_exports.py build/native-acceptance
          for capture in build/native-acceptance/Connections/*.jsonl; do
            analytics/.venv/bin/python -m vehicle_flight_recorder validate-connection "$capture"
          done

      - name: Publish native test and export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VehicleFlightRecorder-native-acceptance
          path: |
            build/native-acceptance/
            build/ios-preview/NativeTests.xcresult/
            build/ios-preview/simulator-startup/
            build/ios/native-build-manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify and package simulator app
        run: |
          mkdir -p build/ios-preview/PackageProducts
          ditto \
            build/ios-preview/DerivedData/Build/Products/Debug-iphonesimulator/VehicleFlightRecorder.app \
            build/ios-preview/PackageProducts/VehicleFlightRecorder.app
          python3 scripts/package_ios_preview.py \
            build/ios-preview/PackageProducts \
            build/ios-preview/VehicleFlightRecorder-simulator.zip

      # Keep the ZIP even if the optional external upload fails later.
      - name: Publish simulator ZIP
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: VehicleFlightRecorder-ios-simulator
          path: build/ios-preview/VehicleFlightRecorder-simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Report downloadable build
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo '## iOS Simulator build'
            echo 'Unsigned native SwiftUI dashboard; MOCK / SIMULATOR, real local Go recorder.'
            echo 'Versioned bridge/lifecycle/export/UI tests passed; unsigned device compile passed. Physical vehicle connection remains disabled.'
            printf '\n[Download build artifact](%s)\n' "$ARTIFACT_URL"
            echo 'Artifact: VehicleFlightRecorder-ios-simulator (14-day retention).'
            echo 'Extract the GitHub artifact once, then upload VehicleFlightRecorder-simulator.zip to Appetize.'
            echo 'The inner ZIP contains VehicleFlightRecorder.app at its root.'
            echo 'Browser launch remains unverified until someone opens the preview and observes the screen.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check optional Appetize configuration
        id: appetize_config
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          UPLOAD_REQUESTED: ${{ inputs.upload_to_appetize }}
        run: |
          if [[ "$UPLOAD_REQUESTED" == true && -n "$APPETIZE_API_TOKEN" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            {
              echo '### Appetize upload skipped'
              echo 'Upload was disabled or APPETIZE_API_TOKEN is not configured.'
              echo 'Download the artifact above, extract it once, and upload the inner simulator ZIP at https://appetize.io/upload.'
              echo 'For automatic upload, add repository secret APPETIZE_API_TOKEN and rerun with upload enabled.'
              echo 'Optional repository secret APPETIZE_PUBLIC_KEY updates an existing preview.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mock-only build to Appetize
        id: appetize
        if: steps.appetize_config.outputs.enabled == 'true'
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: ${{ secrets.APPETIZE_PUBLIC_KEY }}
          platform: ios
          appFile: build/ios-preview/VehicleFlightRecorder-simulator.zip
          fileType: zip
          note: Vehicle Flight Recorder - Milestone 5 transport shell; mock-only simulator
          timeout: '120'

      - name: Report Appetize upload result
        if: ${{ always() && steps.appetize_config.outputs.enabled == 'true' }}
        env:
          UPLOAD_OUTCOME: ${{ steps.appetize.outcome }}
          PREVIEW_KEY: ${{ steps.appetize.outputs.publicKey }}
        run: |
          if [[ "$UPLOAD_OUTCOME" == success && -n "$PREVIEW_KEY" ]]; then
            {
              echo '### Appetize upload succeeded'
              printf '\n[Open browser preview](https://appetize.io/app/%s)\n' "$PREVIEW_KEY"
              echo 'If a reused key is masked, open the corresponding build in your Appetize dashboard.'
              echo 'Interactive Go-backed mock scenarios are available. Browser launch and interactive observation remain separate checks.'
              echo 'Build links may be accessible to anyone holding the link; review Appetize App Permissions before sharing.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Appetize upload failed or returned no preview key; use the saved GitHub artifact for manual upload.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
