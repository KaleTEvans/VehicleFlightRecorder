name: VehicleFlightRecorder
options:
  minimumXcodeGenVersion: "2.42.0"
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VehicleFlightRecorder:
    type: application
    platform: iOS
    sources:
      - path: VehicleFlightRecorder
        excludes:
          - "**/*.md"
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaleevans.vehicleflightrecorder
        INFOPLIST_FILE: VehicleFlightRecorder/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: ExternalAccessory.framework
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
    scheme:
      gatherCoverageData: false
